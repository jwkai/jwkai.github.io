:root[data-theme="dark"]{--fg:#dfe6f5;--muted:#9aa4b2;--line:#5d6878;--rule:#2c3442;--bg:#141922;--panel:#1d2430;--btn:#1d2430;

<div class="flow" id="flow"><svg class="wires" id="wires"></svg><button class="node" style="--c:var(--explorer)" data-k="llm"><b>LLM explorer</b><span>proposes conditions C as σ</span></button><button class="node" style="--c:var(--explorer)" data-k="rl"><b>RL explorer</b><span>learns adversarial traffic σ</span></button><button class="node" style="--c:var(--fg)" data-k="dtmc"><b>MDP ⊗ σ</b><span>the checker&#x27;s input: a DTMC</span></button><button class="node" style="--c:var(--checker)" data-k="sampler"><b>Sampling</b><span>SMC calls it again and again: one trace each</span></button><button class="node" style="--c:var(--checker)" data-k="smc"><b>SMC</b><span>estimates p̂ = Pr[¬φ | C] to a set interval</span></button><button class="node" style="--c:var(--cond)" data-k="ltl"><b>LTLf learner</b><span>in the explorer: explains σ* as ψ</span></button><button class="node" style="--c:var(--muted)" data-k="front"><b>Buffy front-end</b><span>programs compile into the models</span></button><button class="node" style="--c:var(--checker)" data-k="split"><b>Importance splitting</b><span>for rare violations</span></button></div>

"Extra \u00b7 Four more schedulers", "src": "videos/WorstCaseGallery.mp4", "ok": false, "file": "anim/scenes/ch09_learned.py", "cls": "WorstCaseGallery"}}, BX={"motivation": {"label": "Motivation", "sub": "incast: one counterexample, or how likely?", "scenes": ["opening"], "t": 0}, "overview": {"label": "Overview", "sub": "the explorer\u2013checker loop, and Buggy FQ-CoDel", "scenes": ["map0"], "t": 156.42}, "llm": {"label": "LLM explorer", "sub": "proposes conditions C as \u03c3", "scenes": ["map4", "llm"], "t": 556.95}, "rl": {"label": "RL explorer", "sub": "learns adversarial traffic \u03c3", "scenes": ["nfq"], "t": 701.03}, "dtmc": {"label": "MDP \u2297 \u03c3", "sub": "the checker's input: a DTMC", "scenes": ["map1", "dtmc"], "t": 262.63}, "sampler": {"label": "Sampling", "sub": "SMC calls it again and again: one trace each", "scenes": ["map2", "smc"], "t": 368.67}, "smc": {"label": "SMC", "sub": "estimates p\u0302 = Pr[\u00ac\u03c6 | C] to a set interval", "scenes": ["smc"], "t": 437.88}, "ltl": {"label": "LTLf learner", "sub": "in the explorer: explains \u03c3* as \u03c8", "scenes": ["map5", "ltl"], "t": 767.93}, "front": {"label": "Buffy front-end", "sub": "programs compile into the models", "scenes": ["extras9", "front"], "t": 1103.21}, "split": {"label": "Importance splitting", "sub": "for rare violations", "scenes": ["extras8", "split"], "t": 942.63}}, PL=["opening", "map0", "map1", "dtmc", "map2", "why", "smc", "map4", "llm", "nfq", "map5", "ltl", "extras8", "split", "extras9", "front", "outlook"], FULL="videos/full.mp4";

 if(auto)reel.play();document.getElementById('pos').textContent=`scene ${j+1} of ${PL.length}`;
